name: Main CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Regression tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Node 22 for built-in WebSocket browser checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Chromium mobile viewport and interaction smoke test
        run: |
          node scripts/serve.js > /tmp/gdn-static-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/browser-smoke.mjs
